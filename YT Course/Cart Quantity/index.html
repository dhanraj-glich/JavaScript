<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Quantity</title>
</head>
<body>
    <button id="show-count" onclick="showCount()">Show cart count</button>
    <button id="add-to-cart" onclick="addToCart()">Add to cart</button>

    <button id="+2" onclick="addTwo()">+2</button>
    <button id = "+3" onclick="addThree()">+3</button>

    <h2 id="result"> </h2>


    <script>
        let cartCount = 0;

        function addToCart(){
            cartCount++;
            document.getElementById("add-to-cart").innerText = cartCount;

        }

        function addTwo(){
            cartCount += 2
            document.getElementById("+2").innerText = cartCount
        }

        function addThree(){
            cartCount += 3;
            document.getElementById("+3").innerText = cartCount;
        }

        function showCount(){
            document.getElementById("result").innerText = "Your cart contains " + cartCount + " items.";

        }
    </script>

</body>
</html>
